<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canny Edge Detection</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f9; text-align: center; margin: 0; padding: 20px; }
        .container { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 20px; }
        .box { background: #fff; padding: 10px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        video, canvas { display: block; border: 1px solid #ccc; background: #000; width: 480px; height: 270px; }
    </style>
</head>
<body>

    <h2>Canny Edge Detection</h2>
    
    <div class="container">
        <div class="box">
            <h3>Video Input</h3>
            <video id="videoElement" src="demo.mp4" controls crossorigin="anonymous" width="480" height="270"></video>
        </div>

        <div class="box">
            <h3>Canny Edge Detection</h3>
            <canvas id="canvasEdges" width="480" height="270"></canvas>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoElement');
        const canvasEdges = document.getElementById('canvasEdges');
        const ctxEdges = canvasEdges.getContext('2d');

        const offscreenCanvas = document.createElement('canvas');
        const offCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });
        
        offscreenCanvas.width = 480;
        offscreenCanvas.height = 270;

        video.addEventListener('play', () => {
            requestAnimationFrame(processFrame);
        });

        function processFrame() {
            if (video.paused || video.ended) return;

            const width = offscreenCanvas.width;
            const height = offscreenCanvas.height;
            const totalPixels = width * height;

            offCtx.drawImage(video, 0, 0, width, height);
            const frameData = offCtx.getImageData(0, 0, width, height);
            const data = frameData.data;

            // 1. Chuyển sang Grayscale
            const grayscale = new Uint8Array(totalPixels);
            for (let i = 0; i < totalPixels; i++) {
                const idx = i * 4;
                grayscale[i] = (data[idx] * 0.299 + data[idx + 1] * 0.587 + data[idx + 2] * 0.114);
            }

            // Mảng lưu trữ độ lớn (Magnitude) và hướng (Angle) của Sobel
            const mag = new Float32Array(totalPixels);
            const angle = new Float32Array(totalPixels);

            // 2. Tính Gradient (Sobel) và Hướng
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    const i = y * width + x;

                    const tl = grayscale[i - width - 1], tc = grayscale[i - width], tr = grayscale[i - width + 1];
                    const cl = grayscale[i - 1],                            cr = grayscale[i + 1];
                    const bl = grayscale[i + width - 1], bc = grayscale[i + width], br = grayscale[i + width + 1];

                    const gx = -tl + tr - 2 * cl + 2 * cr - bl + br;
                    const gy = -tl - 2 * tc - tr + bl + 2 * bc + br;

                    mag[i] = Math.sqrt(gx * gx + gy * gy);
                    
                    // Tính góc của đường biên (từ radian sang độ)
                    let theta = Math.atan2(gy, gx) * (180 / Math.PI);
                    if (theta < 0) theta += 180;
                    angle[i] = theta;
                }
            }

            const edgeData = ctxEdges.createImageData(width, height);
            const output = edgeData.data;

            // Ngưỡng cho Canny (Có thể tinh chỉnh)
            const highThreshold = 60;
            const lowThreshold = 20;

            // 3. Triệt tiêu phi cực đại (Non-maximum Suppression) & 4. Ngưỡng kép
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    const i = y * width + x;
                    const q = mag[i];
                    
                    if (q === 0) continue; // Bỏ qua pixel đen

                    let p1 = 255, p2 = 255;
                    const a = angle[i];

                    // Gom góc về 4 hướng chính: 0°, 45°, 90°, 135° để so sánh với pixel lân cận
                    if ((a >= 0 && a < 22.5) || (a >= 157.5 && a <= 180)) {
                        p1 = mag[i - 1]; // Trái
                        p2 = mag[i + 1]; // Phải
                    } else if (a >= 22.5 && a < 67.5) {
                        p1 = mag[i - width + 1]; // Góc trên phải
                        p2 = mag[i + width - 1]; // Góc dưới trái
                    } else if (a >= 67.5 && a < 112.5) {
                        p1 = mag[i - width]; // Trên
                        p2 = mag[i + width]; // Dưới
                    } else if (a >= 112.5 && a < 157.5) {
                        p1 = mag[i - width - 1]; // Góc trên trái
                        p2 = mag[i + width + 1]; // Góc dưới phải
                    }

                    // Nếu pixel hiện tại là cực đại so với 2 pixel lân cận theo hướng gradient
                    let finalValue = 0;
                    if (q >= p1 && q >= p2) {
                        // Double Threshold (Ngưỡng kép)
                        if (q >= highThreshold) {
                            finalValue = 255; // Biên nét (Strong edge)
                        } else if (q >= lowThreshold) {
                            finalValue = 100; // Biên mờ (Weak edge - màu xám)
                        }
                    }

                    const outIdx = i * 4;
                    output[outIdx] = finalValue;     // R
                    output[outIdx + 1] = finalValue; // G
                    output[outIdx + 2] = finalValue; // B
                    output[outIdx + 3] = 255;        // A
                }
            }

            ctxEdges.putImageData(edgeData, 0, 0);
            requestAnimationFrame(processFrame);
        }
    </script>
</body>
</html>
